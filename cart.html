
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giỏ hàng - MiniShop</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/cart.css">
</head>
<body>
    <!-- ĐẦU TRANG -->
    <header class="site-header">
        <h1>MiniShop</h1>
        <nav class="main-nav">
            <a href="index.html">Trang chủ</a> 
            <a href="about.html">Giới thiệu</a> 
            <a href="contact.html">Liên hệ</a> 
            <a href="cart.html">Giỏ hàng</a> 
            <a href="login.html">Đăng nhập</a> 
            <a href="register.html">Đăng ký</a>
        </nav>
    </header>

    <!-- NỘI DUNG CHÍNH -->
    <main>
        <h2>Giỏ hàng</h2>

        <table class="cart-table">
            <thead>
                <tr>
                    <th>Sản phẩm</th>
                    <th>Đơn giá</th>
                    <th>Số lượng</th>
                    <th>Thành tiền</th>
                    <th>Thao tác</th>
                </tr>
            </thead>

            <tbody id="cart-items">
                <!-- JavaScript hiển thị sản phẩm tại đây -->
            </tbody>

            <tfoot>
                <tr>
                    <td colspan="3"><strong>Tổng cộng</strong></td>
                    <td colspan="2" id="cart-total">
                        <strong>0 đ</strong>
                    </td>
                </tr>
            </tfoot>
        </table>

        <p id="empty-cart" hidden>Giỏ hàng của bạn đang trống.</p>

        <p>
            <button type="button" id="clear-cart-btn">Xóa toàn bộ giỏ hàng</button>
            <button type="button" id="checkout-btn">Đặt hàng</button>
        </p>
    </main>

    <!-- CHÂN TRANG -->
    <footer class="site-footer">
        <p>&copy; 2026 MiniShop. Dự án thực hành lập trình web.</p>
    </footer>

    <script src="js/cart.js"></script>
</body>
</html>
